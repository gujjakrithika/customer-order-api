services:
 db:
   image: postgres:17
   container_name: postgres-db
   environment:
     POSTGRES_USER: postgres
     POSTGRES_PASSWORD: "Krithika@2751"
     POSTGRES_DB: customer_order_db
   ports:
     - "5432:5432"
   healthcheck:
     test: ["CMD-SHELL", "pg_isready -U postgres -d customer_order_db"]
     interval: 5s
     timeout: 5s
     retries: 5
   networks:
     - customer-network
 api:
   build:
     context: .
     dockerfile: Containerfile
   container_name: customer-api-container
   ports:
     - "8000:8000"
   depends_on:
     db:
       condition: service_healthy
   restart: on-failure
   networks:
     - customer-network
networks:
 customer-network:
   driver: bridge
